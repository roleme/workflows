name: lint-python
description: Run ruff on the repo's Python code when the PR changes it.

inputs:
  paths:
    description: Newline-separated git pathspec globs; the check runs only when the PR changes a matching file
    required: false
    default: |
      **/*.py
      pyproject.toml
      ruff.toml
      .ruff.toml
  base:
    description: Ref to diff against; defaults to origin/<PR base branch>, and without one the check always runs
    required: false
    default: ""
  force:
    description: Run even when no matching file changed
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        BASE: ${{ inputs.base }}
        FORCE: ${{ inputs.force }}
      run: bash "$GITHUB_ACTION_PATH/../ci/gate.sh"
    - if: steps.gate.outputs.run == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - if: steps.gate.outputs.run == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../.lefthook/pre-push/lint-python.sh"
