name: lint-shell
description: Run shellcheck on the repo's shell scripts when the PR changes them.

inputs:
  paths:
    description: Newline-separated git pathspec globs; the check runs only when the PR changes a matching file
    required: false
    default: |
      **/*.sh
      **/*.bash
      .shellcheckrc
  base:
    description: Ref to diff against; defaults to origin/<PR base branch>, and without one the check always runs
    required: false
    default: ""
  force:
    description: Run even when no matching file changed
    required: false
    default: "false"
  severity:
    description: Minimum shellcheck severity to report
    required: false
    default: "warning"

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        BASE: ${{ inputs.base }}
        FORCE: ${{ inputs.force }}
      run: bash "$GITHUB_ACTION_PATH/../ci/gate.sh"
    - if: steps.gate.outputs.run == 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: false
    - if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        SEVERITY: ${{ inputs.severity }}
      run: bash "$GITHUB_ACTION_PATH/../.lefthook/pre-push/lint-shell.sh"
