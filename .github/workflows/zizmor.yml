name: zizmor (Actions security)

on:
  pull_request:
    paths:
      - '.github/workflows/**'

# Least privilege: zizmor only reads the repo. advanced-security: false means
# results are surfaced as workflow annotations (not SARIF upload), so no
# security-events permission is needed.
permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
