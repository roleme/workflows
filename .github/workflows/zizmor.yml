name: zizmor (Actions security)

on:
  # Runs on every PR (not just workflow changes) so it is a dependable required
  # status check: the release-please PR edits only the manifest/CHANGELOG, and a
  # path-filtered required check would never report and would deadlock that PR.
  pull_request:

# Least privilege: zizmor only reads the repo. advanced-security: false means
# results are surfaced as workflow annotations (not SARIF upload), so no
# security-events permission is needed.
permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
