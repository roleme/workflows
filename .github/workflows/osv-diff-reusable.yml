# Reusable PR check that fails only on vulnerabilities the PR itself adds: it
# scans the base and the PR with OSV-Scanner and compares the two, so findings
# that already existed never turn an unrelated PR red. Those go to the weekly
# third-party scan instead. Callers delegate here:
#
#   on: pull_request
#   permissions: {}
#   jobs:
#     osv-diff:
#       uses: roleme/workflows/.github/workflows/osv-diff-reusable.yml@<sha>
#       permissions:
#         actions: read
#         contents: read
#         security-events: write
#
# security-events: write is required by the called workflow's job even though
# upload-sarif is off, so no code-scanning alerts are written.
name: osv-diff (reusable)

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  osv-diff:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      upload-sarif: false
