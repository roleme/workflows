# Reusable: build a Docker image, push it to GHCR, and trigger an instant
# Komodo deploy. Used by the bot repos (asia-trip-bot, kurwa_bot).
#
# Each caller keeps its own `on: push` trigger with a repo-specific `paths:`
# filter (the set of source paths that should rebuild the image), then
# delegates here:
#
#   jobs:
#     publish:
#       uses: roleme/workflows/.github/workflows/docker-publish-reusable.yml@main
#       permissions:
#         contents: read
#         packages: write
#       with:
#         image: ghcr.io/<owner>/<repo>
#         komodo-stack: <stack-name>
#         komodo-host: <komodo-host>
#       secrets: inherit
#
# Deploy trigger: after the GHCR push, the final step curls Komodo's per-stack
# GitHub listener, HMAC-signing the body with KOMODO_WEBHOOK_SECRET (the
# stack's webhook_secret). Stacks have webhook_force_deploy=true so Komodo runs
# a real DeployStack (pull) — a new :latest leaves compose.yaml unchanged, so
# DeployStackIfChanged would no-op. Without this step the stack still updates
# via Komodo's poll; the webhook just makes it near-instant.
name: docker-publish (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: Fully-qualified GHCR image name (e.g. ghcr.io/owner/repo)
        required: true
        type: string
      komodo-stack:
        description: Komodo stack name for the deploy listener URL
        required: true
        type: string
      komodo-host:
        description: Komodo host for the deploy listener (e.g. komodo.example.com)
        required: true
        type: string
      context:
        description: Docker build context
        required: false
        type: string
        default: .
      extra-tags:
        description: |
          Extra docker/metadata-action tag lines to append (newline-separated),
          in addition to the always-applied `type=raw,value=latest`. Use to
          mirror an upstream base version, e.g.
          `type=raw,value=1.0.1369_30-05-2026`.
        required: false
        type: string
        default: ""
      ref:
        description: |
          Commit SHA to build. Empty (the default) builds whatever the event
          checks out, which is right for `on: push`. A caller triggered by
          `workflow_run` MUST pass `github.event.workflow_run.head_sha`: that
          event runs with GITHUB_SHA set to the DEFAULT BRANCH head, so without
          this the build silently takes a different commit than the one whose
          checks passed.

          SECURITY. `workflow_run` runs with secrets and a write token even
          when the workflow that triggered it had neither, and it fires for
          runs on FORK pull requests. A fork's head_sha passed here would build
          attacker-controlled code with packages:write and the Komodo webhook
          secret. The job below refuses a ref that is not an ancestor of the
          default branch, which is what makes that safe — a fork commit never
          is. Callers should still not point this at a fork-PR-triggered
          workflow.
        required: false
        type: string
        default: ""
    secrets:
      KOMODO_WEBHOOK_SECRET:
        description: HMAC secret for the Komodo stack webhook
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty is checkout's own default: the event's ref.
          ref: ${{ inputs.ref }}
          # A pinned ref lands on a DETACHED HEAD with no branch or tag
          # pointing at it. At depth 1 metadata-action's git context then
          # resolves an empty ref (and throws outright on some decorations),
          # and the ancestry check below has no history to walk. Full history
          # only when it is needed; an unpinned build stays shallow.
          fetch-depth: ${{ inputs.ref != '' && 0 || 1 }}

      # Refuse anything that is not already on the default branch. A fork PR's
      # head commit is not, so this is what stops `workflow_run` handing
      # packages:write and the deploy secret to untrusted code. It runs BEFORE
      # login and build so a refusal costs nothing and leaks nothing.
      - name: Verify the pinned ref is on the default branch
        if: inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Checkout fetches the pinned commit by refspec and leaves NO
          # remote-tracking refs, so origin/<default> does not exist yet and a
          # bare merge-base would die with "Not a valid object name" — failing
          # every pinned build, not just an untrusted one.
          git fetch --no-tags --depth=0 origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$REF" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::$REF is not an ancestor of $DEFAULT_BRANCH - refusing to build it."
            exit 1
          fi
          echo "$REF is on $DEFAULT_BRANCH."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          # Only when a ref was pinned. `workflow` (the default) reads the
          # EVENT, so a pinned build would be labelled with the default-branch
          # SHA while containing another commit — and that label is how the bot
          # repos verify a deploy reached prod. `git` reads the checked-out
          # tree instead. Left as `workflow` otherwise, so an existing caller's
          # labels do not change with this input unused.
          context: ${{ inputs.ref != '' && 'git' || 'workflow' }}
          tags: |
            type=raw,value=latest
            ${{ inputs.extra-tags }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Komodo deploy
        # Same-repo composite action, referenced fully-qualified (a local
        # `./komodo-deploy` path would resolve against the CALLER's checkout, not
        # this repo). Pinned to the current release SHA.
        uses: roleme/workflows/komodo-deploy@42a279a616990c708e8a4af4366def3e28e26142 # v2.4.0
        with:
          host: ${{ inputs.komodo-host }}
          stack: ${{ inputs.komodo-stack }}
          webhook-secret: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
