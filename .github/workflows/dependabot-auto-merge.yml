name: Dependabot auto-merge (reusable)

on:
  workflow_call:
    inputs:
      validate-command:
        description: Shell command to run as the validation step before merging
        required: false
        type: string
        default: "echo 'no validation configured'"
      merge-target:
        description: Semver level to auto-merge (patch or minor)
        required: false
        type: string
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run validation
        # Pass the caller-supplied command via env so it is set as a string
        # value, never spliced into the script text. Interpolating
        # ${{ inputs.validate-command }} directly into run: would allow a
        # calling repo to inject arbitrary code into this write-capable,
        # auto-merging reusable workflow.
        env:
          VALIDATE_COMMAND: ${{ inputs.validate-command }}
        run: |
          bash -c "$VALIDATE_COMMAND"

  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ inputs.merge-target }}
          merge-method: squash

      - name: Approve only for major/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: major
          merge-method: squash
          approve-only: true

      - name: Comment on major/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "**${UPDATE_TYPE} detected** for \`${DEP_NAMES}\` — validate passed but merge requires manual review. Check the changelog for breaking changes before merging."
