# Reusable scheduled scan of third-party code: dependency advisories, container
# image CVEs, Go stdlib/module vulnerabilities and vulnerable GitHub Actions.
# Their results change as advisories are published, so they must not gate PRs;
# this workflow records them in ONE issue per repo instead. Callers add a thin
# weekly wrapper:
#
#   on:
#     schedule:
#       - cron: "0 5 * * 1"
#     workflow_dispatch: {}
#   permissions: {}
#   jobs:
#     scan:
#       uses: roleme/workflows/.github/workflows/third-party-scan-reusable.yml@<sha>
#       permissions:
#         contents: read
#         issues: write
#         packages: read
#       with:
#         pip-audit: |
#           requirements.txt
#         govulncheck: true
#         trivy-images: |
#           ghcr.io/owner/repo:latest
#
# The issue is created on the first finding, edited in place while findings
# remain, and closed with a comment once every scan is clean. Scan jobs only
# read the repo; only the report job can write issues.
#
# A run only replaces the sections of the scanners it ran and keeps the rest of
# the issue as earlier runs left it, so a caller can also run one scanner right
# after a build (osv: false, zizmor: false, trivy-images: <image>) without
# wiping the weekly results.
#
# GitHub does not notify on an edited issue, so when a scanner's result is worse
# than the section it replaces (newly failing, or more critical or high findings)
# the report job also posts a comment listing what got worse.
name: third-party scan (reusable)

on:
  workflow_call:
    inputs:
      osv:
        description: Scan lockfiles and requirements files with OSV-Scanner
        required: false
        type: boolean
        default: true
      pip-audit:
        description: Newline-separated requirements files to audit with pip-audit, which resolves the full dependency tree including unpinned transitives
        required: false
        type: string
        default: ""
      govulncheck:
        description: Run govulncheck on ./... (needs go.mod)
        required: false
        type: boolean
        default: false
      trivy-images:
        description: Newline-separated container images to scan with Trivy
        required: false
        type: string
        default: ""
      trivy-summary:
        description: Report one row of CRITICAL and HIGH counts per image that has findings, instead of the full Trivy tables. Use it for many images.
        required: false
        type: boolean
        default: false
      zizmor:
        description: Audit workflows with zizmor, including its online checks for vulnerable actions
        required: false
        type: boolean
        default: true
      issue-title:
        description: Title of the single tracking issue
        required: false
        type: string
        default: Third-party security findings

permissions:
  contents: read

env:
  # renovate: datasource=docker depName=ghcr.io/google/osv-scanner
  OSV_SCANNER_VERSION: v2.7.1
  # renovate: datasource=pypi depName=pip-audit
  PIP_AUDIT_VERSION: 2.10.1
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.32.0

jobs:
  osv:
    if: ${{ inputs.osv }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.scan.outputs.status }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scan
        run: |
          docker pull --quiet "ghcr.io/google/osv-scanner:${OSV_SCANNER_VERSION}" >/dev/null
          set +e
          out=$(docker run --rm -v "$PWD:/src" -w /src "ghcr.io/google/osv-scanner:${OSV_SCANNER_VERSION}" scan source --recursive . 2>&1)
          code=$?
          printf '%s\n' "$out"
          # exit 128 = no lockfiles or requirements files found: nothing to scan
          [ "$code" -ne 128 ] || code=0
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "status=$([ "$code" -eq 0 ] && echo ok || echo "failed (exit $code)")"
            echo "report<<$delim"
            printf '%s\n' "$out" | head -c 6000
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  pip-audit:
    if: ${{ inputs.pip-audit != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.scan.outputs.status }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - id: scan
        env:
          FILES: ${{ inputs.pip-audit }}
        run: |
          set +e
          args=()
          while IFS= read -r f; do
            [ -n "$f" ] && args+=(-r "$f")
          done <<< "$FILES"
          out=$(uvx "pip-audit@${PIP_AUDIT_VERSION}" "${args[@]}" 2>&1)
          code=$?
          printf '%s\n' "$out"
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "status=$([ "$code" -eq 0 ] && echo ok || echo "failed (exit $code)")"
            echo "report<<$delim"
            printf '%s\n' "$out" | head -c 6000
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  govulncheck:
    if: ${{ inputs.govulncheck }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.scan.outputs.status }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: scan
        run: |
          set +e
          out=$(go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./... 2>&1)
          code=$?
          out=$(printf '%s\n' "$out" | grep -v '^go: ' | awk '/^Vulnerability #/ {n=0} /^ +#[0-9]+:/ {n++; if (n>2) next} {print}')
          printf '%s\n' "$out"
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "status=$([ "$code" -eq 0 ] && echo ok || echo "failed (exit $code)")"
            echo "report<<$delim"
            printf '%s\n' "$out" | head -c 6000
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  trivy:
    if: ${{ inputs.trivy-images != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      status: ${{ steps.scan.outputs.status }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2
      - id: scan
        env:
          IMAGES: ${{ inputs.trivy-images }}
          SUMMARY: ${{ inputs.trivy-summary }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Credentials go to ghcr.io only, never to other registries.
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          out=""
          code=0
          scanned=0
          flagged=0
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            scanned=$((scanned + 1))
            if [ "$SUMMARY" = "true" ]; then
              json=$(trivy image --quiet --ignore-unfixed --severity HIGH,CRITICAL --format json "$image" 2>/dev/null)
              rc=$?
              counts=$(jq -r '[.Results[]?.Vulnerabilities[]?.Severity] | "\(map(select(. == "CRITICAL")) | length) \(map(select(. == "HIGH")) | length)"' <<< "$json" 2>/dev/null)
              if [ "$rc" -ne 0 ] || [ -z "$counts" ]; then
                echo "scan error: $image"
                out+="scan error  $image"$'\n'
                flagged=$((flagged + 1)); code=1
              elif [ "$counts" != "0 0" ]; then
                echo "$counts  $image"
                out+="$counts  $image"$'\n'
                flagged=$((flagged + 1)); code=1
              fi
              continue
            fi
            echo "::group::$image"
            res=$(trivy image --quiet --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image" 2>&1)
            rc=$?
            printf '%s\n' "$res"
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || code=$rc
            out+="### $image"$'\n'"$res"$'\n\n'
          done <<< "$IMAGES"
          if [ "$SUMMARY" = "true" ]; then
            out="$flagged of $scanned images have fixable HIGH or CRITICAL findings (columns: critical high image)"$'\n\n'"$(printf '%s' "$out" | sort -rn)"
          fi
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "status=$([ "$code" -eq 0 ] && echo ok || echo "failed (exit $code)")"
            echo "report<<$delim"
            printf '%s\n' "$out" | head -c 12000
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  zizmor:
    if: ${{ inputs.zizmor }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.scan.outputs.status }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(uvx "zizmor@${ZIZMOR_VERSION}" . 2>&1)
          code=$?
          printf '%s\n' "$out"
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "status=$([ "$code" -eq 0 ] && echo ok || echo "failed (exit $code)")"
            echo "report<<$delim"
            printf '%s\n' "$out" | head -c 6000
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  report:
    if: ${{ always() }}
    needs: [osv, pip-audit, govulncheck, trivy, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          TITLE: ${{ inputs.issue-title }}
        with:
          script: |
            const titles = {
              osv: 'OSV-Scanner (dependencies)',
              'pip-audit': 'pip-audit (Python, full dependency tree)',
              govulncheck: 'govulncheck (Go)',
              trivy: 'Trivy (container images)',
              zizmor: 'zizmor (GitHub Actions)',
            };
            const needs = JSON.parse(process.env.NEEDS);
            const title = process.env.TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const ran = {};
            for (const [id, label] of Object.entries(titles)) {
              const job = needs[id];
              if (!job || job.result === 'skipped') continue;
              const status = job.result === 'success' ? (job.outputs.status || 'failed (no result)') : `failed (job ${job.result})`;
              const report = status === 'ok' ? '' : `\n\n\`\`\`\`\n${(job.outputs.report || '').trim()}\n\`\`\`\``;
              ran[id] = `## ${label}: ${status}${report}`;
            }
            if (Object.keys(ran).length === 0) return;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => !i.pull_request && i.title === title);

            // Sections this run did not scan stay as an earlier run left them.
            const kept = {};
            for (const chunk of (existing?.body || '').split(/^(?=## )/m)) {
              const head = chunk.split('\n', 1)[0];
              const id = Object.keys(titles).find((k) => head.startsWith(`## ${titles[k]}: `));
              if (id) kept[id] = chunk.replace(/\n+Output is cut at[^\n]*\s*$/, '').trimEnd();
            }
            const merged = { ...kept, ...ran };
            const ordered = Object.keys(titles).filter((id) => merged[id]).map((id) => merged[id]);
            const isDirty = ordered.some((chunk) => chunk.split('\n', 1)[0].split(': ').pop() !== 'ok');

            const statusOf = (chunk) => (chunk ? chunk.split('\n', 1)[0].split(': ').pop() : '');
            const summarize = (id, chunk) => {
              const t = chunk || '';
              const out = { c: 0, h: 0, n: 0 };
              let m;
              if (id === 'osv') {
                if ((m = t.match(/\((\d+) Critical, (\d+) High/))) { out.c = Number(m[1]); out.h = Number(m[2]); }
                if ((m = t.match(/by (\d+) known vulnerabilit/))) out.n = Number(m[1]);
              } else if (id === 'trivy') {
                if ((m = t.match(/(\d+) of \d+ images have/))) out.n = Number(m[1]);
                for (const r of t.matchAll(/^(\d+) (\d+) {2}\S/gm)) { out.c += Number(r[1]); out.h += Number(r[2]); }
                for (const r of t.matchAll(/Total: \d+ \(HIGH: (\d+), CRITICAL: (\d+)\)/g)) { out.h += Number(r[1]); out.c += Number(r[2]); }
              } else if (id === 'govulncheck') {
                if ((m = t.match(/affected by (\d+) vulnerabilit/))) out.n = Number(m[1]);
              } else if (id === 'pip-audit') {
                if ((m = t.match(/Found (\d+) known vulnerabilit/))) out.n = Number(m[1]);
              }
              return out;
            };
            const describe = (s) => {
              const parts = [s.c ? `${s.c} critical` : '', s.h ? `${s.h} high` : '', s.n ? `${s.n} total` : ''].filter(Boolean);
              return parts.length ? parts.join(', ') : 'findings';
            };
            // What got worse between the previous section (or none) and this run's.
            const worsened = (id, label, before, after) => {
              if (statusOf(after) === 'ok') return null;
              const now = summarize(id, after);
              if (!before || statusOf(before) === 'ok') return `${label}: new findings (${describe(now)})`;
              const was = summarize(id, before);
              const isWorse = now.c > was.c || (now.c === was.c && now.h > was.h) || now.n > was.n;
              return isWorse ? `${label}: ${describe(was)} -> ${describe(now)}` : null;
            };

            // GitHub does not notify on an edited issue, so a worse result also gets a comment.
            const reasons = [];
            for (const id of Object.keys(ran)) {
              const reason = worsened(id, titles[id], kept[id], ran[id]);
              if (reason) reasons.push(reason);
            }

            if (isDirty) {
              const body = [
                `Latest scan run: ${runUrl}`,
                `Updated: ${new Date().toISOString()}`,
                '',
                ordered.join('\n\n'),
                '',
                'Output is cut at 6000 characters per scanner; the full output is in the run log.',
              ].join('\n');
              if (existing) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
                if (reasons.length > 0) {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: existing.number,
                    body: `Findings got worse in ${runUrl}:\n\n${reasons.map((r) => `- ${r}`).join('\n')}`,
                  });
                }
              } else {
                await github.rest.issues.create({ ...context.repo, title, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `All scans are clean in ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }
